<!DOCTYPE html>
<html>
<head>
  <title>AI Quiz Generator</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      width: 400px;
      height: 500px;
      padding: 16px;
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
    }
    .loading {
      display: none;
    }
    .loading.active {
      display: flex;
    }
    /* Additional font styles for specific elements */
    h1, h2, h3, button, select, input {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, Roboto, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
    }
    /* Ensure consistent font rendering */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-indigo-600">AI Quiz Generator</h1>
    
    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Quiz Type</label>
        <select id="quizType" class="w-full p-2 border rounded">
          <option value="multiple-choice">Multiple Choice</option>
          <option value="true-false">True/False</option>
          <option value="open-ended">Open Ended</option>
        </select>
      </div>
      
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Difficulty</label>
        <select id="difficulty" class="w-full p-2 border rounded">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Number of Questions</label>
        <input type="number" id="questionCount" min="1" max="10" value="5" class="w-full p-2 border rounded">
      </div>
      
      <button id="generateBtn" class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700 transition-colors">
        Generate Quiz
      </button>
    </div>
    
    <div id="loading" class="loading items-center justify-center p-4">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
      <span class="ml-2">Generating quiz...</span>
    </div>
    
    <div id="quizContainer" class="bg-white rounded-lg shadow p-4" style="display: none;">
      <!-- Quiz questions will be inserted here -->
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
